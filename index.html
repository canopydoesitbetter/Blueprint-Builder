<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fabri-Cadabra Blueprint Builder Mockup</title>
<style>
:root{--bg:#0f1318;--panel:#171d24;--panel2:#202833;--line:#354252;--text:#eef4fb;--muted:#9aa9b8;--accent:#5ec8ff;--danger:#ff6b78;--grid1:#25303b;--grid3:#2d3a47;--grid12:#42566a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;height:100vh;overflow:hidden}.app{display:grid;grid-template-columns:330px 1fr;height:100vh}.sidebar{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:16px}.brand{font-weight:800;font-size:20px}.sub,.hint,.status{color:var(--muted);font-size:12px}.sub{margin:2px 0 14px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}.card h3{margin:0 0 10px;font-size:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.field input,.field select,button{width:100%;background:#111820;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit}.field input:focus,.field select:focus{outline:2px solid #5ec8ff55;border-color:var(--accent)}button{cursor:pointer;font-weight:700}button.primary{background:linear-gradient(180deg,#1688c2,#0f6f9d);border-color:#249bd0}button.danger{border-color:#7f3940;color:#ffd6da}.parts{display:flex;flex-direction:column;gap:8px}.part{background:#111820;border:1px solid var(--line);border-radius:11px;padding:10px;cursor:grab}.part.disabled{opacity:.45}.partTop{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:13px}.partMeta{font-size:11px;color:var(--muted);margin-top:3px}.partActions{margin-top:8px}.partActions button{padding:6px 8px;font-size:11px}.main{min-width:0;display:flex;flex-direction:column;height:100vh}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#141a21;border-bottom:1px solid var(--line)}.tabs,.toolGroup{display:flex;gap:6px;align-items:center}.tabs button,.toolGroup button{width:auto;padding:8px 10px}.tabs button.active{background:#163d51;border-color:#4aa8d2}.toolGroup .field{min-width:132px}.toolGroup input,.toolGroup select{padding:7px 8px}.spacer{flex:1}.canvasWrap{position:relative;flex:1;min-height:0;background:#0b0f14;overflow:hidden}.canvasWrap.dragover{box-shadow:inset 0 0 0 2px var(--accent)}svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}.floating,.selection{position:absolute;bottom:12px;display:flex;gap:6px;background:#111820e8;border:1px solid var(--line);padding:7px;border-radius:12px}.floating{left:12px}.selection{right:12px;display:none;align-items:center}.selection.show{display:flex}.floating button,.selection button{width:auto;padding:7px 10px}.toast{position:absolute;top:12px;right:12px;background:#111820ee;border:1px solid var(--line);padding:9px 12px;border-radius:10px;font-size:12px;display:none;max-width:320px}.toast.show{display:block}.mobileDrawerBtn{display:none}@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:20;left:0;top:0;bottom:0;width:min(88vw,360px);transform:translateX(-102%);transition:.2s;box-shadow:20px 0 60px #0008}.sidebar.open{transform:none}.mobileDrawerBtn{display:inline-block;width:auto}.status{display:none}.selection{left:12px;right:auto;bottom:58px;max-width:calc(100vw - 24px);flex-wrap:wrap}}
</style></head>
<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand">Blueprint Builder</div><div class="sub">Fabri-Cadabra standalone synchronized-view mockup</div>
<section class="card"><h3>Blueprint Setup</h3><div class="grid3"><div class="field"><label>Width (ft)</label><input id="bp-width" type="number" min="1" value="20"></div><div class="field"><label>Depth (ft)</label><input id="bp-depth" type="number" min="1" value="20"></div><div class="field"><label>Height (ft)</label><input id="bp-height" type="number" min="1" value="10"></div></div><button class="primary" id="apply-blueprint" style="margin-top:8px">Apply Blueprint Size</button><div class="hint">One shared X/Y/Z model. Every view uses real inches.</div></section>
<section class="card"><h3>Tube Builder</h3><div class="field"><label>Tube size</label><select id="profile"><option value="2x2">2" × 2" × 1/8" wall</option><option value="3x3">3" × 3" × 1/8" wall</option><option value="2x6">2" × 6" × 1/8" wall</option></select></div><div class="grid2" style="margin-top:8px"><div class="field"><label for="part-length">Length (in)</label><input id="part-length" type="number" min="0.01" step="0.125" value="72" inputmode="decimal"></div><div class="field"><label>Quantity</label><input id="part-qty" type="number" min="1" value="4"></div></div><button class="primary" id="add-part" style="margin-top:8px">Add to Parts</button></section>
<section class="card"><h3>Parts Drawer</h3><div class="parts" id="parts-list"></div><div class="hint">Desktop: drag a part to the grid. Touch: tap Place, then tap the grid.</div></section></aside>
<main class="main"><div class="toolbar"><button class="mobileDrawerBtn" id="drawer-btn">Parts</button><div class="tabs" id="view-tabs"><button class="active" data-view="top">Top</button><button data-view="wallA">Wall A</button><button data-view="wallB">Wall B</button><button data-view="wallC">Wall C</button><button data-view="wallD">Wall D</button></div><div class="toolGroup"><button id="rotate-view-right" aria-label="Rotate Right">Rotate Right ↻</button></div><div class="toolGroup"><div class="field"><label id="plane-label">Elevation</label><input id="placement-plane" value="0\""></div><div class="field"><label>Placement Direction</label><select id="placement-axis"><option value="h">Horizontal</option><option value="v">Vertical</option></select></div></div><div class="spacer"></div><div class="status" id="view-status"></div></div>
<div class="canvasWrap" id="canvas-wrap"><svg id="blueprint" xmlns="http://www.w3.org/2000/svg" aria-label="Blueprint drafting surface"><defs><pattern id="grid1" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0L0 0 0 1" fill="none" stroke="var(--grid1)" stroke-width=".08"/></pattern><pattern id="grid3" width="3" height="3" patternUnits="userSpaceOnUse"><path d="M3 0L0 0 0 3" fill="none" stroke="var(--grid3)" stroke-width=".14"/></pattern><pattern id="grid12" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0L0 0 0 12" fill="none" stroke="var(--grid12)" stroke-width=".22"/></pattern></defs><g id="scene"></g></svg><div class="floating"><button id="zoom-out" aria-label="Zoom Out">−</button><button id="zoom-label">100%</button><button id="zoom-in" aria-label="Zoom In">+</button><button id="fit-view">Fit</button></div><div class="selection" id="selection-bar"><span id="selection-label" class="status"></span><button id="rotate-member">Rotate 90°</button><button id="rotate-face">Rotate Face 90°</button><button class="danger" id="delete-member">Delete</button></div><div class="toast" id="toast"></div></div></main></div>
<script>(()=>{'use strict';
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id),PROFILES={'2x2':{id:'2x2',label:'2 x 2 x 1/8',short:'2 × 2',a:2,b:2,wall:.125},'3x3':{id:'3x3',label:'3 x 3 x 1/8',short:'3 × 3',a:3,b:3,wall:.125},'2x6':{id:'2x6',label:'2 x 6 x 1/8',short:'2 × 6',a:2,b:6,wall:.125}};
const state={workspace:{width:240,depth:240,height:120},view:'top',plane:{top:0,wallA:0,wallB:0,wallC:240,wallD:240},parts:[],members:[],selectedMemberId:null,armedPartId:null,dragPartId:null,viewport:{u:0,v:0,w:240,h:240},pan:null,move:null,snap:null,nextPart:1,nextMember:1};
const VIEW_AXES={top:{u:'x',v:'y',hidden:'z',horizontal:'x',vertical:'y',planeLabel:'Elevation',uSign:1},wallA:{u:'x',v:'z',hidden:'y',horizontal:'x',vertical:'z',planeLabel:'Depth',uSign:1},wallB:{u:'y',v:'z',hidden:'x',horizontal:'y',vertical:'z',planeLabel:'X Offset',uSign:-1},wallC:{u:'x',v:'z',hidden:'y',horizontal:'x',vertical:'z',planeLabel:'Depth',uSign:-1},wallD:{u:'y',v:'z',hidden:'x',horizontal:'y',vertical:'z',planeLabel:'X Offset',uSign:1}};
function parseMeasurement(raw){if(typeof raw==='number')return Number.isFinite(raw)?raw:null;const s=String(raw??'').trim().toLowerCase();if(!s)return null;if(/^[-+]?\d+(\.\d+)?$/.test(s))return Number(s);let total=0,ok=false,ft=s.match(/([-+]?\d+(?:\.\d+)?)\s*(?:'|ft|feet|foot)/),inch=s.match(/([-+]?\d+(?:\.\d+)?)\s*(?:\"|in|inch|inches)/);if(ft){total+=Number(ft[1])*12;ok=true}if(inch){total+=Number(inch[1]);ok=true}if(!ok){const m=s.match(/^\s*(\d+)\s*[- ]\s*(\d+(?:\.\d+)?)\s*$/);if(m)return Number(m[1])*12+Number(m[2])}return ok?total:null}
function formatMeasurement(inches){let sign=inches<0?'-':'',n=Math.abs(inches),ft=Math.floor(n/12),i=Math.round((n-ft*12)*100)/100;if(i>=12){ft++;i-=12}return`${sign}${ft}'-${i}\"`}\nfunction formatTubeLength(inches){const n=Math.round(Number(inches)*1000)/1000;return`${n}\"`}
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),axisLen=a=>a==='x'?state.workspace.width:a==='y'?state.workspace.depth:state.workspace.height;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function viewSpec(view=state.view){const a=VIEW_AXES[view];return a?{...a,uLen:axisLen(a.u),vLen:axisLen(a.v),hiddenLen:axisLen(a.hidden)}:null}
function axisVector(a){return a==='x'?{x:1,y:0,z:0}:a==='y'?{x:0,y:1,z:0}:{x:0,y:0,z:1}}
function crossMap(m){const p=PROFILES[m.profile],[c1,c2]=m.roll===90?[p.b,p.a]:[p.a,p.b];return m.axis==='x'?{y:c1,z:c2}:m.axis==='y'?{x:c1,z:c2}:{x:c1,y:c2}}
function projectPoint(pt,view=state.view){const s=viewSpec(view),raw=pt[s.u];return{u:s.uSign<0?s.uLen-raw:raw,v:pt[s.v]}}
function modelUFromScreen(u,view=state.view){const s=viewSpec(view);return s.uSign<0?s.uLen-u:u}
function memberEnd(m){const v=axisVector(m.axis);return{x:m.x+v.x*m.length,y:m.y+v.y*m.length,z:m.z+v.z*m.length}}
function memberProjection(m,view=state.view){const s=viewSpec(view),p0=projectPoint(m,view),p1=projectPoint(memberEnd(m),view),cm=crossMap(m);if(m.axis===s.hidden)return{type:'end',u:p0.u,v:p0.v,w:cm[s.u]||2,h:cm[s.v]||2};return{type:'line',u0:p0.u,v0:p0.v,u1:p1.u,v1:p1.v,thickness:cm[m.axis===s.u?s.v:s.u]||2}}
function memberFitsWorkspace(m){const e=memberEnd(m);return[m,e].every(p=>p.x>=0&&p.y>=0&&p.z>=0&&p.x<=state.workspace.width&&p.y<=state.workspace.depth&&p.z<=state.workspace.height)}
function addPart(profile,length,qty){qty=Number(qty);length=Number(length);if(!PROFILES[profile]||!(length>0)||!Number.isInteger(qty)||qty<1)return null;const p={id:'p'+state.nextPart++,profile,length,remaining:qty,total:qty};state.parts.push(p);renderParts();return p}
function addPartFromForm(){const len=Number($('part-length').value),qty=Number($('part-qty').value);if(!(len>0)||!Number.isFinite(len)||!Number.isInteger(qty)||qty<1)return toast('Enter tube length in inches and a whole-number quantity.');addPart($('profile').value,len,qty)}
function renderParts(){const root=$('parts-list');root.innerHTML='';if(!state.parts.length){root.innerHTML='<div class="hint">No staged parts yet.</div>';return}for(const part of state.parts){const p=PROFILES[part.profile],el=document.createElement('div');el.className='part'+(part.remaining<1?' disabled':'');el.draggable=part.remaining>0;el.dataset.partId=part.id;el.innerHTML=`<div class="partTop"><span>${p.label}</span><span>${part.remaining} remaining</span></div><div class="partMeta">${formatTubeLength(part.length)} · ${part.total} created</div><div class="partActions"><button data-place="${part.id}" ${part.remaining<1?'disabled':''}>Place</button></div>`;el.addEventListener('dragstart',e=>{if(part.remaining<1)return e.preventDefault();state.dragPartId=part.id;e.dataTransfer.setData('text/plain',part.id)});root.appendChild(el)}root.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{state.armedPartId=b.dataset.place;toast('Part armed. Tap the grid to place it.');if(innerWidth<860)$('sidebar').classList.remove('open')})}
function setPlaneFromInput(){const n=parseMeasurement($('placement-plane').value),s=viewSpec();if(n===null||n<0||n>s.hiddenLen){toast(`Placement plane must be between 0 and ${formatMeasurement(s.hiddenLen)}.`);return false}state.plane[state.view]=n;return true}
function hiddenCompatible(a,b,view){const s=viewSpec(view),h=a[s.hidden],e=memberEnd(b);if(b.axis===s.hidden)return h>=Math.min(b[s.hidden],e[s.hidden])-.01&&h<=Math.max(b[s.hidden],e[s.hidden])+.01;const cm=crossMap(b),half=(cm[s.hidden]||0)/2;return h>=b[s.hidden]-half-.01&&h<=b[s.hidden]+half+.01}
function snapCandidate(c,moving,view=state.view){let best={u:Math.round(c.u),v:Math.round(c.v),type:'grid',dist:Infinity},threshold=Math.max(2,Math.min(8,state.viewport.w/90));for(const m of state.members){if(moving&&m.id===moving.id||moving&&!hiddenCompatible(moving,m,view))continue;const p=memberProjection(m,view);if(p.type==='line'){for(const ep of[{u:p.u0,v:p.v0},{u:p.u1,v:p.v1}]){const d=Math.hypot(c.u-ep.u,c.v-ep.v);if(d<threshold&&d<best.dist)best={...ep,type:'endpoint',dist:d}}const dx=p.u1-p.u0,dy=p.v1-p.v0,l2=dx*dx+dy*dy;if(l2){const t=clamp(((c.u-p.u0)*dx+(c.v-p.v0)*dy)/l2,0,1),u=p.u0+t*dx,v=p.v0+t*dy,d=Math.hypot(c.u-u,c.v-v);if(d<threshold*.75&&d<best.dist)best={u:Math.round(u),v:Math.round(v),type:'edge',dist:d}}}else{const d=Math.hypot(c.u-p.u,c.v-p.v);if(d<threshold&&d<best.dist)best={u:Math.round(p.u),v:Math.round(p.v),type:'endpoint',dist:d}}}state.snap=best.type==='grid'?null:best;return best}
function placeMember(partId,view,u,v){const part=state.parts.find(p=>p.id===partId);if(!part||part.remaining<1)return null;const s=viewSpec(view),pt={x:0,y:0,z:0};pt[s.u]=modelUFromScreen(u,view);pt[s.v]=v;pt[s.hidden]=state.plane[view];const axis=view===state.view?($('placement-axis').value==='h'?s.horizontal:s.vertical):s.horizontal,m={id:'m'+state.nextMember,sourcePart:part.id,profile:part.profile,length:part.length,axis,roll:0,...pt},sn=snapCandidate({u,v},m,view);m[s.u]=modelUFromScreen(sn.u,view);m[s.v]=sn.v;if(!memberFitsWorkspace(m))return null;state.nextMember++;state.members.push(m);part.remaining--;state.selectedMemberId=m.id;renderParts();renderBlueprint();return m}
function commitPlacement(id,u,v){if(!setPlaneFromInput())return;const m=placeMember(id,state.view,u,v);if(!m)return toast('That placement is invalid or extends outside the blueprint.');state.armedPartId=null}
function currentSvgPoint(e){const r=$('blueprint').getBoundingClientRect();return{u:state.viewport.u+(e.clientX-r.left)/r.width*state.viewport.w,v:state.viewport.v+(e.clientY-r.top)/r.height*state.viewport.h}}
function fitView(){const s=viewSpec(),pad=Math.max(24,Math.max(s.uLen,s.vLen)*.12);state.viewport={u:-pad,v:-pad,w:s.uLen+2*pad,h:s.vLen+2*pad};updateZoomLabel();renderBlueprint()}
function setZoom(f,c=null){const v=state.viewport,q=c||{u:v.u+v.w/2,v:v.v+v.h/2},nw=clamp(v.w*f,12,viewSpec().uLen*4),nh=nw*($('blueprint').clientHeight/Math.max(1,$('blueprint').clientWidth)),rx=(q.u-v.u)/v.w,ry=(q.v-v.v)/v.h;v.u=q.u-rx*nw;v.v=q.v-ry*nh;v.w=nw;v.h=nh;updateZoomLabel();renderBlueprint()}
function updateZoomLabel(){$('zoom-label').textContent=Math.round(viewSpec().uLen/state.viewport.w*100)+'%'}
function svgEl(n,a={}){const e=document.createElementNS(NS,n);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));return e}
function renderMember(m,px){const p=memberProjection(m),g=svgEl('g',{'data-member-id':m.id,'data-axis':m.axis,'data-x':m.x,'data-y':m.y,'data-z':m.z,style:'cursor:grab'}),sel=m.id===state.selectedMemberId,fill=sel?'#fff7a8':'#9ddcff',stroke=sel?'#f6d74a':'#4fa3c8';if(p.type==='line'){const x=p.u0===p.u1?p.u0-p.thickness/2:Math.min(p.u0,p.u1),y=p.v0===p.v1?p.v0-p.thickness/2:Math.min(p.v0,p.v1),w=Math.abs(p.u1-p.u0)||p.thickness,h=Math.abs(p.v1-p.v0)||p.thickness;g.appendChild(svgEl('rect',{x,y,width:w,height:h,fill,stroke,'stroke-width':Math.max(.2,.8/px)}))}else g.appendChild(svgEl('rect',{x:p.u-p.w/2,y:p.v-p.h/2,width:p.w,height:p.h,fill,stroke,'stroke-width':Math.max(.2,.8/px)}));g.onpointerdown=e=>{e.stopPropagation();state.selectedMemberId=m.id;state.move={id:m.id,start:currentSvgPoint(e),orig:{x:m.x,y:m.y,z:m.z}};$('blueprint').setPointerCapture(e.pointerId);renderBlueprint()};return g}
function renderBlueprint(){const s=viewSpec(),root=$('scene');root.innerHTML='';$('blueprint').setAttribute('viewBox',`${state.viewport.u} ${state.viewport.v} ${state.viewport.w} ${state.viewport.h}`);$('plane-label').textContent=s.planeLabel;$('view-status').textContent=`${state.view==='top'?'TOP':state.view.replace('wall','WALL ')} · ${formatMeasurement(s.uLen)} × ${formatMeasurement(s.vLen)}`;root.appendChild(svgEl('rect',{x:0,y:0,width:s.uLen,height:s.vLen,fill:'#0e151c',stroke:'#6d8397','stroke-width':.5}));const px=$('blueprint').clientWidth/state.viewport.w;if(px>6)root.appendChild(svgEl('rect',{x:0,y:0,width:s.uLen,height:s.vLen,fill:'url(#grid1)'}));if(px>2)root.appendChild(svgEl('rect',{x:0,y:0,width:s.uLen,height:s.vLen,fill:'url(#grid3)'}));root.appendChild(svgEl('rect',{x:0,y:0,width:s.uLen,height:s.vLen,fill:'url(#grid12)'}));state.members.forEach(m=>root.appendChild(renderMember(m,px)));if(state.snap)root.appendChild(svgEl('circle',{cx:state.snap.u,cy:state.snap.v,r:Math.max(.8,5/px),fill:'none',stroke:'#7fe0b4','stroke-width':Math.max(.3,1.5/px)}));const m=state.members.find(x=>x.id===state.selectedMemberId);$('selection-bar').classList.toggle('show',!!m);if(m){$('selection-label').textContent=`${PROFILES[m.profile].short} · ${formatTubeLength(m.length)} · ${m.axis.toUpperCase()} axis`;$('rotate-face').style.display=m.profile==='2x6'?'inline-block':'none'}}
function rotateMemberInView(id,view=state.view){const m=state.members.find(x=>x.id===id);if(!m)return false;const s=viewSpec(view),old=m.axis;m.axis=m.axis===s.horizontal?s.vertical:s.horizontal;if(!memberFitsWorkspace(m)){m.axis=old;return false}renderBlueprint();return true}
function rotateMemberFace(id){const m=state.members.find(x=>x.id===id);if(!m||m.profile!=='2x6')return false;m.roll=m.roll===90?0:90;renderBlueprint();return true}
function deleteMember(id){const i=state.members.findIndex(x=>x.id===id);if(i<0)return false;const[m]=state.members.splice(i,1),p=state.parts.find(x=>x.id===m.sourcePart);if(p)p.remaining++;if(state.selectedMemberId===id)state.selectedMemberId=null;renderParts();renderBlueprint();return true}
function setView(view){if(!VIEW_AXES[view])return false;state.view=view;document.querySelectorAll('#view-tabs [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('placement-plane').value=formatMeasurement(state.plane[view]);fitView();return true}
function rotateViewRight(){const a=['wallA','wallB','wallC','wallD'],i=a.indexOf(state.view);return setView(i<0?'wallA':a[(i+1)%4])}
function applyBlueprint(){const old=state.workspace,width=Number($('bp-width').value)*12,depth=Number($('bp-depth').value)*12,height=Number($('bp-height').value)*12;if(![width,depth,height].every(n=>n>0&&Number.isFinite(n)))return toast('Blueprint dimensions must be positive.');state.workspace={width,depth,height};state.plane.top=clamp(state.plane.top,0,height);state.plane.wallA=clamp(state.plane.wallA,0,depth);state.plane.wallB=clamp(state.plane.wallB,0,width);state.plane.wallC=state.plane.wallC===old.depth?depth:clamp(state.plane.wallC,0,depth);state.plane.wallD=state.plane.wallD===old.width?width:clamp(state.plane.wallD,0,width);state.members=state.members.filter(m=>memberFitsWorkspace(m));$('placement-plane').value=formatMeasurement(state.plane[state.view]);fitView();renderParts()}
